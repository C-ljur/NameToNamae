name: Bug report
description: Report a problem with Namae / 不具合の報告
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        日本語可 / English OK

  - type: dropdown
    id: feature
    attributes:
      label: Which feature / どの機能
      options:
        - Pawn names / 人名の翻訳
        - Animal names / 動物の命名
        - Natural line breaks / 改行整形
        - Developer mode display / 開発者モードの表示
        - Mod settings / 設定画面
        - Name reports / 名前レポートの書き出し
        - Not sure / わからない
        - Other / その他
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened / どうなったか
      placeholder: |
        Examples / 例:
        Names stayed in English. / 名前が英語のまま表示された。
        An error appeared in the log. / ログにエラーが出た。
        Text was cut off in the settings window. / 設定画面で文字が切れた。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 再現手順
    validations:
      required: true

  - type: input
    id: rimworld
    attributes:
      label: RimWorld version / RimWorldのバージョン
      placeholder: "1.6.4871"
    validations:
      required: true

  - type: input
    id: namae
    attributes:
      label: Namae version / Namaeのバージョン
      description: Release tag. If you use the Steam version, just write Steam. / Releaseのタグ。Steam版なら「Steam」でよい。
      placeholder: "v1.0.0"
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: How installed / 導入方法
      options:
        - Steam Workshop
        - GitHub release
        - Other
    validations:
      required: true

  - type: textarea
    id: mods
    attributes:
      label: Other mods / 併用MOD
      description: Especially name-related and UI mods. / 特に名前系・UI系。
    validations:
      required: true

  - type: input
    id: log
    attributes:
      label: Log URL / ログのURL
      description: HugsLib log share link, or paste the log below. / HugsLibの共有リンク、または下の欄に貼り付け。

  - type: textarea
    id: extra
    attributes:
      label: Log or screenshots / ログ・スクリーンショット
      render: text
