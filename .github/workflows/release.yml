name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name used for the archive file names"
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate XML
        run: python Source/tools/check_xml.py

      - name: Resolve version
        id: version
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build packages
        run: python Source/tools/build_workshop_package.py

      - name: Create archives
        run: python Source/tools/make_release_archives.py "${{ steps.version.outputs.name }}"

      - name: Upload archives as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: namae-packages
          path: Namae-*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: Namae-*.zip
